name: ci
# subaco テンプレートリポジトリ自身の CI。
#
# (a) smoke test: 3 テンプレート（minimal / standard / multi-agent）を一時 dir へ
#     nix flake init -t で展開 → bash bootstrap.sh --ci（非対話）→ nix develop で基本コマンド
#     （rg --version 等）応答 → agent-context ゲート＝check / skills check ＋ 決定的 scaffold
#     （--agent generic）+ git diff --exit-code による生成一致検証（a-c-m 同梱の standard /
#     multi-agent のみ。minimal は a-c-m 非同梱のため対象外）。ubuntu / macos マトリクス・Determinate Nix。
#
# (b) タグ運用:
#     `nix flake init -t github:subaco-dev/subaco#standard` は既定ブランチ（main）を取得するため、
#     開発中の main 破壊が DoD の 5 分クイックスタートを壊し得る。README は安定タグ参照
#     `github:subaco-dev/subaco/<tag>#standard` を案内する。テンプレート変更のリリース手順:
#       1) 本 smoke が両 OS × 3 テンプレートで green,
#       2) 安定タグ vX.Y を付与（テンプレート変更は minor 以上）,
#       3) README のタグ参照を更新する,
#       4) タグ push で sandbox-image.yml が共通サンドボックスイメージ（2 アーキ +
#          マニフェストリスト）を GHCR へ publish するので、Job Summary の digest 固定参照を
#          templates/multi-agent/.envrc の CUBE_TEMPLATE_ID へピン留めする（M2a-3）。
on:
  push:
    branches: [main]
  pull_request:

# 最小権限（権限最小化に準ずる）。
permissions:
  contents: read

jobs:
  # subaco 自身の flake（templates 出力・devShell・formatter）の評価健全性。
  flake-check:
    name: nix flake check (subaco repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: 供給網対策としてリリース時に commit SHA へピン留めする。
      - uses: DeterminateSystems/nix-installer-action@main
      - name: nix flake check
        run: nix flake check

  # 3 テンプレート × 2 OS の smoke（展開 → bootstrap → devShell 基本コマンド）。
  smoke:
    name: smoke ${{ matrix.template }} @ ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        template: [minimal, standard, multi-agent]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: 展開 → bootstrap → 基本コマンド応答
        # matrix.template は本ワークフローが定める固定値のみ（外部入力ではない）。
        # env 経由で渡し run では $TEMPLATE として参照する（インジェクション対策の作法）。
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          set -euxo pipefail
          proj="${RUNNER_TEMP}/proj-${TEMPLATE}"
          rm -rf "$proj"
          mkdir -p "$proj"
          cd "$proj"

          # ローカル checkout の flake からテンプレートを展開する。
          # GITHUB_WORKSPACE は subaco リポジトリ直下（flake.nix / templates/ を含む）。
          nix flake init -t "${GITHUB_WORKSPACE}#${TEMPLATE}"

          # 以降の nix develop は path-flake 参照（path:$proj）で固定する。bootstrap が最後に
          # git init するため、素の `nix develop`（= git-flake 評価）では未追跡ファイルが
          # 評価から除外され "flake.nix 不在" 相当になる。path: は git 状態を無視しディレクトリ
          # 全体をコピーして評価するため、git init 前後どちらでも安定する。
          if [ "$TEMPLATE" != "minimal" ]; then
            # a-c-m を vendor（座標は v0.1.1 で確定済み。bootstrap も不在時に取得するが、
            # ここで先行取得してネットワーク失敗を bootstrap と切り分ける）。
            bash scripts/vendor-acm.sh
            # 非対話 bootstrap。`nix flake init` はファイルの実行ビットを保存しない
            # （展開直後は -rw-r--r--）ため、必ず bash 経由で実行する（./bootstrap.sh は不可）。
            nix develop "path:$proj" -c bash ./bootstrap.sh --ci
          fi

          # 基本コマンド応答（DoD 代表確認。devShell が正しく解決される証跡）。
          nix develop "path:$proj" -c rg --version
          nix develop "path:$proj" -c jq --version

          # 実行プレーン検証ヘルパー（multi-agent のみ）: --help が stdlib のみで応答する
          # （E2B SDK は遅延 import のため未 sync でも壊れない。SDK 実接続の検証は
          # subaco-shim 側の live スイートが担う——M2b-3 のテンプレート組み込み分）。
          if [ "$TEMPLATE" = "multi-agent" ]; then
            nix develop "path:$proj" -c python3 scripts/sandbox_run.py --help >/dev/null
          fi

      - name: agent-context ゲート（standard / multi-agent のみ）
        if: matrix.template != 'minimal'
        # a-c-m の vendored copy（bootstrap が取得・scaffold 済み）を前提とする必須ゲート。
        # check / skills check（構造検査）に加え、テンプレート CI と同一の決定的条件
        # （--agent generic 固定）で scaffold を再実行し `git diff --exit-code` で
        # 「bootstrap 直後のコミットが scaffold の固定点になっている」ことを検証する
        # （= 生成一致ゲートが新規プロジェクトで最初から green である保証）。
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          set -euxo pipefail
          proj="${RUNNER_TEMP}/proj-${TEMPLATE}"
          cd "$proj"
          nix develop "path:$proj" -c agent-context check .
          nix develop "path:$proj" -c agent-context skills check .
          git add -A
          git -c user.email=ci@example.invalid -c user.name=ci commit -qm "bootstrap"
          nix develop "path:$proj" -c agent-context scaffold . --agent generic --append-generated-block
          git diff --exit-code
