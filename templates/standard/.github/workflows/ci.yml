name: ci
# standard テンプレート生成プロジェクトの CI。
# 必須ジョブ: nix flake check（devShell / flake の再現性）+ agent-context check（構造検査）
# + agent-context skills check（スキルレジストリ検査）+ 生成一致ゲート（決定的 scaffold +
# git diff --exit-code。check は存在・参照・マーカー整合の構造検査であり生成結果の一致は
# 検査しないため、ドリフト検出は最後のゲートが担う）。
on:
  push:
  pull_request:

# 最小権限（権限最小化に準ずる）。
permissions:
  contents: read

jobs:
  check:
    name: nix flake check + agent-context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Determinate Nix（flakes / nix-command が既定で有効）。
      # TODO: 供給網対策としてリリース時に commit SHA へピン留めする。
      - uses: DeterminateSystems/nix-installer-action@main

      # devShell とテンプレート flake の再現性検査。
      - name: nix flake check
        run: nix flake check

      # a-c-m の vendored copy を用意（冪等。取得座標は v0.1.1 で確定済み）。通常は bootstrap が
      # vendor/ をコミットしており不要だが、未 vendoring のリポジトリでも本ジョブが取得して検査を通す。
      - name: vendor agent-context-maintainer
        run: |
          bash scripts/vendor-acm.sh

      # 構造検査（必須ファイルの存在・相互参照・マーカー整合。生成結果の一致は検査しない）。
      # devShell 提供の配置非依存ラッパー agent-context 経由（実体配置に依存しない）。
      - name: agent-context check
        run: nix develop -c agent-context check .

      # スキルレジストリの検査。
      - name: agent-context skills check
        run: nix develop -c agent-context skills check .

      # 生成一致ゲート（真のドリフト検出）: 決定的条件（--agent generic 固定・クリーン
      # checkout）で scaffold を再実行し、生成部がコミット済み内容と一致することを検証する。
      # ファイル追加等で Repository Snapshot（.agents/core.md）が変わった場合は、
      # ローカルで `agent-context scaffold . --agent generic --append-generated-block` を
      # 再実行してコミットすれば green に戻る（--agent auto は実行者の環境変数で profiles の
      # active フラグが変わるため使わない）。
      - name: agent-context 生成一致ゲート（scaffold + git diff）
        run: |
          nix develop -c agent-context scaffold . --agent generic --append-generated-block
          git diff --exit-code
